<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Assistant"; font-weight: 700; src: url("../assets/fonts/Assistant-700.ttf"); }
  @font-face { font-family: "Assistant"; font-weight: 800; src: url("../assets/fonts/Assistant-800.ttf"); }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #root { position: relative; overflow: hidden; font-family: "Assistant", sans-serif; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="root"></div>
<script type="module">
// The renderer (render.js) drives time: it calls __setup once, then __frame(t) for every
// output frame and screenshots #root. Animations never use wall-clock time or rAF, so a
// frame is a pure function of t and renders are reproducible.
const q = new URLSearchParams(location.search);
const mod = (await import(`./lib/${q.get("anim")}.js`)).default;
const root = document.getElementById("root");
window.__setup = async (params, W, H) => {
  root.style.width = W + "px";
  root.style.height = H + "px";
  await document.fonts.load('800 40px "Assistant"');
  await document.fonts.load('700 40px "Assistant"');
  const info = await mod.setup(root, params, W, H);
  return info || {};
};
window.__frame = async (t) => { await mod.frame(t); };
window.__ready = true;
</script>
</body>
</html>
