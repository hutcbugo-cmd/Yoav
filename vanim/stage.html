<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Assistant"; font-weight: 700; src: url("../assets/fonts/Assistant-700.ttf"); }
  @font-face { font-family: "Assistant"; font-weight: 800; src: url("../assets/fonts/Assistant-800.ttf"); }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #root { position: relative; overflow: hidden; font-family: "Assistant", sans-serif; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="root"></div>
<script type="module">
// The renderer (render.js) drives time: it calls __setup once, then __frame(t) for every
// output frame and screenshots #root. Animations never use wall-clock time or rAF, so a
// frame is a pure function of t and renders are reproducible.
const q = new URLSearchParams(location.search);
const mod = (await import(`./lib/${q.get("anim")}.js`)).default;
const root = document.getElementById("root");
window.__setup = async (params, W, H) => {
  root.style.width = W + "px";
  root.style.height = H + "px";
  await document.fonts.load('800 40px "Assistant"');
  await document.fonts.load('700 40px "Assistant"');
  // Engine-level retiming, so an animation's beats land on the spoken words:
  //   _speed: plays faster (>1) or slower (<1)
  //   _timemap: [[out_t, anim_t], ...] piecewise-linear, increasing; flat-ish segments hold a
  //             beat (e.g. keep the results list up until she says "portfolio")
  const info = Object.assign({}, await mod.setup(root, params, W, H));
  const speed = params._speed || 1;
  const map = params._timemap || [[0, 0], [info.duration / speed, info.duration]];
  const interp = (x, xs, ys) => {
    if (x <= xs[0]) return ys[0] + (x - xs[0]) * (ys[1] - ys[0]) / (xs[1] - xs[0] || 1);
    for (let i = 1; i < xs.length; i++) if (x <= xs[i])
      return ys[i - 1] + (x - xs[i - 1]) * (ys[i] - ys[i - 1]) / (xs[i] - xs[i - 1]);
    const n = xs.length - 1;
    return ys[n] + (x - xs[n]) * (ys[n] - ys[n - 1]) / (xs[n] - xs[n - 1] || 1);
  };
  const outs = map.map((m) => m[0]), anims = map.map((m) => m[1]);
  toAnim = (t) => interp(t, outs, anims);
  const toOut = (a) => interp(a, anims, outs);
  info.duration = toOut(info.duration);
  info.sfx = (info.sfx || []).map((c) => Object.assign({}, c, { t: toOut(c.t) }));
  // images (logos, product shots) must be decoded before the first frame is captured
  await Promise.all([...root.querySelectorAll("img")].map((im) => im.decode().catch(() => {
    console.error("image failed to load: " + im.src); })));
  return info;
};
let toAnim = (t) => t;
window.__frame = async (t) => { await mod.frame(toAnim(t)); };
window.__ready = true;
</script>
</body>
</html>
